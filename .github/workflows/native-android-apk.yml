name: Joyfliper Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/libgdx-android]
    paths:
      - 'native/**'
      - '.github/workflows/native-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: native
        run: gradle :android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: joyfliper-native-debug-apk
          path: native/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
